[/Script/UnrealEd.ProjectPackagingSettings]
; 스테이지 레벨은 StageDefinition의 TSoftObjectPtr<UWorld>로만 참조되므로 쿠킹에서 누락될 수 있다.
; 맵 폴더를 통째로 지정해 소프트 참조만 있는 레벨도 함께 쿠킹되도록 한다.
+DirectoriesToAlwaysCook=(Path="/Game/Maps")
+DirectoriesToAlwaysCook=(Path="/Game/Run")
; 아이템 정의는 세이브가 FPrimaryAssetId로만 참조하므로 하드 레퍼런스가 없다 — 지정하지 않으면 쿠킹에서 통째로 빠진다.
+DirectoriesToAlwaysCook=(Path="/Game/Items")

[/Script/Engine.AssetManagerSettings]
; 인벤토리 세이브는 UACItemDefinition 에셋을 FPrimaryAssetId로만 기록한다.
; 이 스캔 규칙이 없으면 AssetManager가 ID를 경로로 되돌리지 못해 저장된 아이템이 전부 로드에서 사라진다.
; PrimaryAssetType은 UACItemDefinition::ItemDefinitionAssetType과 반드시 같아야 한다.
+PrimaryAssetTypesToScan=(PrimaryAssetType="ACItemDefinition",AssetBaseClass=/Script/Ashen_Cathedral.ACItemDefinition,bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Items")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))

; 아이템 에셋의 "이름"이 곧 세이브 키다. 에셋 이름을 바꾸면 아래 리다이렉트를 추가해야 기존 세이브의 아이템이 살아난다.
; +PrimaryAssetIdRedirects=(OldName="ACItemDefinition:DA_Item_Old",NewName="ACItemDefinition:DA_Item_New")
